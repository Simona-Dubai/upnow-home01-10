<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UpNow — Verified providers across Dubai</title>
    <meta
      name="description"
      content="Residential, commercial, industrial, land, holiday homes, venues, courts and yachts — plus services, experiences, memberships, programs and insurance across Dubai. Call or WhatsApp verified providers directly."
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/search.css" />
    <link rel="stylesheet" href="css/detail.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body class="mobile-shell">
    <div id="desktop-site">
      <div id="hdr"></div>
      <section class="home-hero" data-screen-label="Home hero">
        <div class="hero-bg" id="bg"><img alt="" /><img alt="" /></div>
        <div class="wrap">
          <span class="hero-kicker" id="kick"></span>
          <h1 id="h1"></h1>
          <p class="subtitle" id="sub"></p>
          <div class="hero-search" id="sw"></div>
        </div>
        <span class="hero-credit" id="credit"></span>
      </section>
      <div class="trust-bar" id="trust"></div>
      <main class="wrap">
        <div id="cats" class="category-rail"></div>
        <div id="sections"></div>
        <section class="section">
          <div class="section-header">
            <div>
              <h2 id="areasH">Popular areas</h2>
              <p>
                Jump straight to results in Dubai's most-searched communities.
              </p>
            </div>
          </div>
          <div class="popular-areas" id="areas"></div>
        </section>
        <section class="section">
          <div class="section-header">
            <div>
              <h2>How UpNow works</h2>
              <p>
                No checkout and no booking fee. You deal with the verified
                provider directly.
              </p>
            </div>
          </div>
          <div class="how-it-works" id="why"></div>
        </section>
      </main>
      <div id="ftr"></div>
    </div>
    <div id="mobile-app">
      <div class="phone-frame">
        <div class="phone-island"></div>
        <div class="phone-screen" id="scr"></div>
      </div>
    </div>
    <script src="js/core/paths.js"></script>
    <script src="data/listings.js"></script>
    <script src="components/icons.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/engine.js"></script>
    <script src="js/core/state.js"></script>
    <script src="components/overlays.js"></script>
    <script src="components/layout.js"></script>
    <script src="components/card.js"></script>
    <script src="components/contact.js"></script>
    <script src="components/filters.js"></script>
    <script src="components/detail/core.js"></script>
    <script src="components/detail/spaces.js"></script>
    <script src="components/detail/others.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/home-mobile.js"></script>
  </body>
</html>
