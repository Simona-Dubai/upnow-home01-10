<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UpNow — Verified providers across Dubai</title>
<meta name="description" content="Residential, commercial, industrial, land, holiday homes, venues, courts and yachts — plus services, experiences, memberships, programs and insurance across Dubai. Call or WhatsApp verified providers directly.">
<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/search.css">
<style>
.herosec{position:relative;padding:40px 0 34px;background:#1b2a22;z-index:20}
.herosec .wrap{position:relative;z-index:2}
.herosec .pop,.herosec .more-pop{z-index:100}
.herosec .bg{position:absolute;inset:0;overflow:hidden}
.herosec .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .7s ease,transform 6s ease}
.herosec .bg img.on{opacity:1;transform:scale(1)}
.herosec .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(244,247,244,.97) 0%,rgba(244,247,244,.88) 36%,rgba(244,247,244,.15) 70%)}
.kick{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;background:var(--g1);color:var(--g8);border:1px solid var(--g2);padding:6px 12px;border-radius:99px;font-weight:700;font-size:12.5px}
.kick .ico{width:14px;height:14px}
.herosec h1{font-family:var(--serif);font-weight:500;font-size:60px;line-height:1.04;letter-spacing:-.015em;margin:18px 0 12px;color:var(--g9);max-width:640px;min-height:125px;display:flex;align-items:flex-end}
.herosec .sub{font-size:16px;color:var(--ink2);max-width:460px;margin:0 0 28px;min-height:72px}
.herosec .sw{max-width:1180px}
.herosec .credit{position:absolute;right:20px;bottom:12px;font-size:11px;font-weight:700;color:#fff;background:rgba(11,61,42,.55);backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px;z-index:2}
.trust{display:flex;gap:26px;padding:14px 0;border-bottom:1px solid var(--line);background:#fff;font-weight:600;color:var(--ink2);font-size:13px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.trust span{display:flex;align-items:center;gap:7px}.trust .ico{color:var(--g6)}
/* category rail — icons */
.cats{display:grid;grid-template-columns:repeat(var(--n,9),minmax(0,1fr));gap:6px;padding:26px 0 6px}
.cats a{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;padding:12px 4px;border-radius:14px;font-weight:600;font-size:12.5px;color:var(--ink2);text-align:center;transition:.15s}
.cats a:hover{background:var(--bg);color:var(--ink)}
.cats a i{width:56px;height:56px;border-radius:16px;background:var(--g1);display:grid;place-items:center;color:var(--g7);transition:.15s}
.cats a i .ico{width:24px;height:24px;stroke-width:1.6}
.cats a:hover i{transform:translateY(-2px);background:var(--g2)}
.cats a.on i{background:var(--g7);color:#fff;box-shadow:0 6px 16px rgba(19,97,66,.25)}
.cats a.on{color:var(--g8)}
.cats a small{color:var(--ink3);font-weight:500;font-size:11px;margin-top:-5px}
/* compact browse strip: sub-types of the selected category */
.brw{display:flex;align-items:stretch;gap:0;margin:22px 0 4px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.brw .bh{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--g1);border-right:1px solid var(--line);font-weight:800;font-size:13px;color:var(--g9);white-space:nowrap}
.brw .bh i{width:30px;height:30px;border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--g7)}.brw .bh i .ico{width:16px;height:16px}
.brw .bh small{display:block;font-weight:600;color:var(--ink3);font-size:11px}
.brw .bs{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:9px 12px;flex:1;min-width:0}
.brw .grp{display:flex;align-items:center;gap:5px;flex:none}
.brw .grp+.grp{border-left:1px solid var(--line);padding-left:10px;margin-left:4px}
.brw .gl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-right:3px}
.brw a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--ink2);white-space:nowrap;transition:.12s}
.brw a:hover{background:var(--bg);color:var(--g8)}
.brw a em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink3);background:var(--bg);border-radius:6px;padding:1px 6px}
.brw a:hover em{background:#fff}
.brw a .ico{width:14px;height:14px;color:var(--g6)}
.brw .all{flex:none;display:flex;align-items:center;padding:0 16px;border-left:1px solid var(--line);font-weight:800;font-size:12.5px;color:var(--g7);gap:4px;white-space:nowrap}
.brw .all:hover{background:var(--g1)}
.sec{margin-top:40px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:20px}
.sec-h h2{font-size:24px;letter-spacing:-.02em}
.sec-h p{margin:4px 0 0;color:var(--ink3)}
.sec-h a{color:var(--g7);font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:22px 18px}
.pop-areas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pop-areas a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pop-areas a:hover{border-color:var(--g5)}
.pop-areas a small{display:block;color:var(--ink3);font-weight:500;font-size:12px;margin-top:2px}
.pop-areas .ico{color:var(--ink3)}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.why div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px}
.why .n{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--g8);display:grid;place-items:center;font-weight:800;font-size:12.5px;margin-bottom:10px}
.why b{display:block;margin-bottom:4px}.why span{color:var(--ink3);font-size:13px}
@media (max-width:1200px){.row{grid-template-columns:repeat(4,1fr)}.row>:nth-child(n+5){display:none}}
@media (max-width:900px){.cats{display:flex;overflow-x:auto}.cats a{flex:0 0 96px}}
@media (max-width:900px){.herosec h1{font-size:44px}.row{grid-template-columns:repeat(2,1fr)}.pop-areas,.why{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<div id="hdr"></div>
<section class="herosec" data-screen-label="Home hero">
  <div class="bg" id="bg"><img alt=""><img alt=""></div>
  <div class="wrap">
    <span class="kick" id="kick"></span>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="sw" id="sw"></div>
  </div>
  <span class="credit" id="credit"></span>
</section>
<div class="trust" id="trust"></div>
<main class="wrap">
  <div id="cats"></div>
  <div id="sections"></div>
  <section class="sec"><div class="sec-h"><div><h2 id="areasH">Popular areas</h2><p>Jump straight to results in Dubai's most-searched communities.</p></div></div><div class="pop-areas" id="areas"></div></section>
  <section class="sec"><div class="sec-h"><div><h2>How UpNow works</h2><p>No checkout and no booking fee. You deal with the verified provider directly.</p></div></div><div class="why" id="why"></div></section>
</main>
<div id="ftr"></div>
<script src="js/data.js"></script><script src="js/common.js"></script><script src="js/filters-ui.js"></script>
<script>
const { VERTICALS, VORDER, LISTINGS, AREAS, offerOf } = UP;
const { ico, esc, card, toQuery, results, blankState, t } = UPUI;
document.getElementById('hdr').innerHTML = UPUI.header('home');
document.getElementById('ftr').innerHTML = UPUI.footer();
UPUI.bindHeader();

let saved = {}; try { saved = JSON.parse(localStorage.getItem('upnow.home') || '{}'); } catch (e) {}
const S = blankState(saved.v || 'spaces', saved.o);
const go = () => { location.href = 'Search.html' + toQuery(S); };

const COPY = {
  all: ['Everything Dubai, one search.', 'Spaces, services, experiences, memberships, programs and insurance — from verified providers.'],
  spaces: ['Find a space you can trust.', 'Homes, offices, warehouses, land, holiday homes, venues, courts and yachts. Connect with verified owners, agents and operators.'],
  services: ['Book a service you can trust.', 'From cleaning and AC to salons and dentists. Licensed, reviewed and ready to reply on WhatsApp.'],
  experiences: ['Discover experiences worth remembering.', 'Tours, workshops and desert safaris from DTCM-licensed operators.'],
  memberships: ['Join places that fit your life.', 'Compare plans, benefits, access and locations before you join.'],
  programs: ['Find the right program to grow.', 'Schools, courses, camps and academies with clear admissions and schedules.'],
  insurance: ['Protect what matters to you.', 'Motor, health and property quotes from CBUAE-licensed insurers.']
};
const HERO = { residential: 'img/hero.jpg', commercial: 'img/office1.jpg', industrial: 'img/wh3.jpg', land: 'img/aerial1.jpg', mixed: 'img/aerial2.jpg', holiday: 'img/villa1.jpg', venue: 'img/venue2.jpg', court: 'img/padel1.jpg', yacht: 'img/yacht2.jpg',
  cleaning: 'img/clean1.jpg', ac: 'img/ac1.jpg', haircut: 'img/salon1.jpg', dentist: 'img/dental1.jpg', safari: 'img/desert2.jpg', workshop: 'img/workshop1.jpg', tour: 'img/desert1.jpg', gym: 'img/fit2.jpg', credits: 'img/fit1.jpg', school: 'img/school1.jpg', course: 'img/office2.jpg', camp: 'img/school2.jpg', academy: 'img/padel2.jpg', all: 'img/hero.jpg' };
const OICO = UPF.OICO || { cleaning: 'spark', ac: 'snow', haircut: 'user', dentist: 'heart', safari: 'sun', workshop: 'tool', tour: 'compass', gym: 'bolt', credits: 'tag', school: 'grad', course: 'doc', camp: 'sun', academy: 'ball', motor: 'car', health: 'heart', property: 'home' };
const iconOf = (v, o) => o.icon || OICO[o.id] || VERTICALS[v].icon;

const bgImgs = [...document.querySelectorAll('#bg img')]; let bgIdx = 0, bgCur = null;
function setHero(src) { if (src === bgCur) return; bgCur = src; const next = bgImgs[1 - bgIdx]; const pre = new Image(); pre.onload = pre.onerror = () => { next.src = src; requestAnimationFrame(() => { next.classList.add('on'); bgImgs[bgIdx].classList.remove('on'); bgIdx = 1 - bgIdx; }); }; pre.src = src; }

function paint() {
  localStorage.setItem('upnow.home', JSON.stringify({ v: S.v, o: S.o }));
  const c = COPY[S.v] || COPY.all;
  document.getElementById('h1').textContent = c[0];
  document.getElementById('sub').textContent = c[1];
  document.getElementById('kick').innerHTML = ico('shield') + 'Verified providers across Dubai';
  const O = S.v === 'all' ? null : offerOf(S.v, S.o);
  setHero(HERO[S.v === 'all' ? 'all' : S.o] || HERO.all);
  document.getElementById('credit').textContent = O ? VERTICALS[S.v].label + ' · ' + O.label : 'All verticals';

  const inV = LISTINGS.filter(l => S.v === 'all' || l.v === S.v);
  document.getElementById('trust').innerHTML = [
    ['check', `${inV.filter(l => l.a.verified).length} verified ${S.v === 'all' ? 'listings' : VERTICALS[S.v].label.toLowerCase()} results`],
    ['phone', 'Direct provider contact'],
    ['clock', `${Math.round(inV.reduce((s, l) => s + l.provider.reply, 0) / inV.length)} min average reply`],
    ['star', `${(inV.reduce((s, l) => s + l.rating, 0) / inV.length).toFixed(1)} · ${inV.reduce((s, l) => s + l.reviews, 0).toLocaleString()} verified reviews`]
  ].map(([i, s]) => `<span>${ico(i)}${esc(s)}</span>`).join('');

  /* Compact browse strip — the search panel above already lists the categories, so this shows what's INSIDE the
     selected category: its type facet, a size facet and 2–3 popular toggles, each with a live count. */
  const cats = document.getElementById('cats');
  if (S.v === 'all') {
    cats.innerHTML = `<div class="brw"><div class="bh"><i>${ico('grid4')}</i><span>Browse<small>${LISTINGS.length} listings</small></span></div><div class="bs skip-scroll"><div class="grp">${VORDER.map(v => `<a href="Search.html?v=${v}">${ico(VERTICALS[v].icon)}${esc(VERTICALS[v].label)}<em>${LISTINGS.filter(l => l.v === v).length}</em></a>`).join('')}</div></div></div>`;
  } else {
    const base = blankState(S.v, S.o), skipT = ['price', 'term', 'billing', 'verified'];
    const facets = O.defs.filter(d => (d.type === 'multi' || d.type === 'select') && !d.isDate && !skipT.includes(d.id) && d.options && d.options.length <= 8 && d.id !== 'amenities' && d.id !== 'time').slice(0, 2);
    const tg = O.defs.filter(d => d.type === 'toggle' && d.id !== 'verified').slice(0, 3);
    const href = f => 'Search.html' + toQuery({ ...base, f: { ...base.f, ...f } });
    const cnt = f => results({ ...base, f: { ...base.f, ...f } }).length;
    const grp = (label, items) => items.length ? `<div class="grp"><span class="gl">${esc(label)}</span>${items.join('')}</div>` : '';
    const facetHTML = facets.map((d, i) => grp(d.label, d.options.map(o => { const f = { [d.id]: d.type === 'multi' ? [o.v] : o.v }, n = cnt(f); return n ? `<a href="${href(f)}">${esc(d.id === 'beds' && o.v !== '0' ? o.l + ' bed' : o.l)}<em>${n}</em></a>` : ''; }).filter(Boolean))).join('');
    const tgHTML = grp('Popular', tg.map(d => { const n = cnt({ [d.id]: true }); return n ? `<a href="${href({ [d.id]: true })}">${ico('check')}${esc(d.label.replace(/ \(.*\)/, ''))}<em>${n}</em></a>` : ''; }).filter(Boolean));
    cats.innerHTML = `<div class="brw" data-screen-label="Browse ${esc(O.label)}"><div class="bh"><i>${ico(iconOf(S.v, O))}</i><span>${esc(t(O.label))}<small>${results(base).length} listings</small></span></div>
      <div class="bs skip-scroll">${facetHTML}${tgHTML}</div><a class="all" href="Search.html${toQuery(base)}">See all ${ico('chevR')}</a></div>`;
  }

  const blocks = S.v === 'all'
    ? VORDER.map(v => ({ t: VERTICALS[v].label, p: COPY[v][1], list: LISTINGS.filter(l => l.v === v).sort((a, b) => b.rating - a.rating), href: '?v=' + v }))
    : VERTICALS[S.v].offers.map(o => { const B = blankState(S.v, o.id); return { t: o.h1, p: o.basis + ' · verified providers', list: results(B), href: toQuery(B), on: o.id === S.o }; }).sort((a, b) => (b.on || 0) - (a.on || 0));
  document.getElementById('sections').innerHTML = blocks.filter(b => b.list.length).map(b => `
    <section class="sec"><div class="sec-h"><div><h2>${esc(b.t)}</h2>${b.p ? `<p>${esc(b.p)}</p>` : ''}</div><a href="Search.html${b.href}">See all ${b.list.length} ${ico('chevR')}</a></div>
    <div class="row">${b.list.slice(0, 5).map(l => card(l)).join('')}</div></section>`).join('');

  const pool = S.v === 'all' ? inV : inV.filter(l => l.cat === S.o);
  const areas = AREAS.map(a => ({ ...a, c: pool.filter(l => l.loc === a.id || (l.coverage || []).includes(a.id)).length })).filter(a => a.c).sort((a, b) => b.c - a.c).slice(0, 8);
  document.getElementById('areasH').textContent = O ? `Popular areas for ${O.h1.toLowerCase()}` : 'Popular areas';
  document.getElementById('areas').innerHTML = areas.map(a => `<a href="Search.html${toQuery({ ...blankState(S.v, S.o), loc: [a.id] })}"><span>${esc(a.n)}<small>${a.c} listings</small></span>${ico('chevR')}</a>`).join('');

  document.getElementById('why').innerHTML = [
    ['Find what you need', 'Choose a category, then search with the filters that matter.'],
    ['Compare verified providers', 'Check photos, pricing, permits and provider details.'],
    ['Call, WhatsApp or email', 'It reaches the provider instantly as a lead with your details.'],
    ['Deal directly', 'Viewings, contracts and payments are agreed with the provider — UpNow never takes your money.']
  ].map(([b, s], i) => `<div><span class="n">${i + 1}</span><b>${b}</b><span>${s}</span></div>`).join('');
}
UPF.SearchBar(document.getElementById('sw'), S, { mode: 'hero', onChange: paint, onSubmit: go });
paint();
Object.values(HERO).forEach(s => new Image().src = s);
</script>
</body></html>
