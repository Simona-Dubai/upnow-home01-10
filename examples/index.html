<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atlas Coworking — example site</title>
    <meta name="description" content="Example landing page built from the UpNow components with different content and a blue theme." />
    <link rel="stylesheet" href="../css/main.css?v=r1" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div id="hdr"></div>

    <section class="example-hero">
      <div class="wrap">
        <span class="kicker" id="kicker"></span>
        <h1 id="title"></h1>
        <p id="text"></p>
        <div class="actions" id="heroActions"></div>
      </div>
    </section>

    <main class="wrap">
      <section class="example-section">
        <h2>Why members stay</h2>
        <p>Everything you need to get work done, in every location.</p>
        <div class="example-features" id="features"></div>
      </section>

      <section class="example-section">
        <h2>Popular workspaces</h2>
        <p>The same card component as the marketplace, with different content.</p>
        <div class="example-grid" id="spaces"></div>
      </section>

      <section class="example-section" id="pricing">
        <h2>Pricing</h2>
        <p>Month-to-month plans or pay as you go.</p>
        <div class="example-panel"><div id="planTabs"></div><div class="example-plans" id="plans"></div></div>
      </section>

      <section class="example-section" id="faq">
        <h2>Questions</h2>
        <div class="example-panel example-faq" id="faqList"></div>
      </section>

      <section class="example-section" id="tour">
        <h2>Book a tour</h2>
        <p>We reply within the hour on working days.</p>
        <form class="example-panel form-grid" id="tourForm"></form>
      </section>
    </main>

    <div id="ftr"></div>

    <!-- generic layer only: paths → content → icons → utils → ui → overlays → layout -->
    <script src="../js/core/paths.js?v=5"></script>
    <script src="content.js"></script>
    <script src="../components/icons.js?v=3"></script>
    <script src="../js/core/utils.js?v=8"></script>
    <script src="../components/ui.js?v=r1"></script>
    <script src="../components/overlays.js?v=r1"></script>
    <script src="../components/layout.js?v=r1"></script>
    <script src="js/landing.js?v=r1"></script>
  </body>
</html>
